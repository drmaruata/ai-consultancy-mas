[project]
name = "ai-consultancy-mas"
version = "3.0.0"
description = "AI Consultancy Agency — Multi-Agent System (MAS) v3.0"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "upstash-redis>=1.7.0",
    "upstash-vector>=0.8.0",
    "upstash-workflow>=0.1.3",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "mcp>=1.0.0",
    "confluent-kafka>=2.3.0",
    "supabase>=2.3.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "verticals", "shared-services/agent_framework", "shared-services/llm_router", "shared-services/memory", "shared-services/messaging", "shared-services/ip_registry", "shared-services/kb_validity"]

[tool.hatch.build.targets.wheel.sources]
"shared-services" = ""

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
pythonpath = ["shared-services"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
